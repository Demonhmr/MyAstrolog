name: zvezditsa

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Telegram-бот: запуск `docker compose --profile bot up -d bot` (токен — BOT_TOKEN в .env)
  bot:
    build: .
    image: zvezditsa:latest
    container_name: zvezditsa_bot
    restart: unless-stopped
    profiles: ["bot"]
    # Telegram Bot API: адрес из DNS (149.154.166.110) с AdminVPS не отвечает (блокировка в РФ),
    # 149.154.167.220 отвечает (проверено 17.11 и 20.11.2026). Так же закреплено у n8n Волпеня.
    # Проверить другой адрес: curl --resolve api.telegram.org:443:<ip> https://api.telegram.org/bot0:x/getMe → 401
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
    env_file:
      - .env
    volumes:
      # База пользователей и прогнозов — в томе, чтобы переживала пересборку
      - zvezditsa_data:/app/storage
      # Кэш шрифтов matplotlib — без него первый рендер занимает 30-60 сек при каждом рестарте
      - matplotlib_cache:/root/.cache/matplotlib
    logging: *logging

  # Сервер расчёта для сайта и Android: ничего не хранит, наружу — через nginx /api/
  api:
    build: .
    image: zvezditsa:latest
    container_name: zvezditsa_api
    restart: unless-stopped
    command: ["uvicorn", "api.app:app", "--host", "0.0.0.0", "--port", "8090", "--no-access-log"]
    ports:
      - "127.0.0.1:8090:8090"
    mem_limit: 700m
    volumes:
      - matplotlib_cache:/root/.cache/matplotlib
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/api/health', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
    logging: *logging

volumes:
  zvezditsa_data:
  matplotlib_cache:
