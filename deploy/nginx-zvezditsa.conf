# Звездица — https://zvezditsa.ru (вне FASTPANEL). Код: /opt/zvezditsa
# Источник: репозиторий deploy/nginx-zvezditsa.conf → /etc/nginx/conf.d/zvezditsa.conf (scp, nginx -t, reload)
# listen с IP обязателен: FASTPANEL слушает 137.22.150.127, без IP наш server не выбирается.
# Сертификаты: certbot webroot /var/www/zvezditsa/acme — zvezditsa.ru (+www) и старый sslip (до отказа от него).

# HTTP: ACME для всех имён, остальное — на https://zvezditsa.ru
server {
    listen 137.22.150.127:80;
    server_name zvezditsa.ru www.zvezditsa.ru zvezditsa.137-22-150-127.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/zvezditsa/acme; }
    location / { return 301 https://zvezditsa.ru$request_uri; }
}

# www → без www
server {
    listen 137.22.150.127:443 ssl;
    http2 on;
    server_name www.zvezditsa.ru;
    ssl_certificate     /etc/letsencrypt/live/zvezditsa.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zvezditsa.ru/privkey.pem;
    return 301 https://zvezditsa.ru$request_uri;
}

# Старый адрес (сайт до 20.11.2026, APK 1.0) → новый домен.
# Профили в localStorage к новому адресу не переезжают — пользователь вводит данные заново.
server {
    listen 137.22.150.127:443 ssl;
    http2 on;
    server_name zvezditsa.137-22-150-127.sslip.io;
    ssl_certificate     /etc/letsencrypt/live/zvezditsa.137-22-150-127.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zvezditsa.137-22-150-127.sslip.io/privkey.pem;
    return 301 https://zvezditsa.ru$request_uri;
}

server {
    listen 137.22.150.127:443 ssl;
    http2 on;
    server_name zvezditsa.ru;
    ssl_certificate     /etc/letsencrypt/live/zvezditsa.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zvezditsa.ru/privkey.pem;

    root /var/www/zvezditsa/site;
    index index.html;
    charset utf-8;
    access_log /var/log/nginx/zvezditsa.access.log;
    error_log  /var/log/nginx/zvezditsa.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        access_log off;   # запросы к расчёту (город, IP) не журналируем
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        client_max_body_size 1m;   # перенос дневника с устройства — до 1000 записей
    }

    # Возврат с оплаты Robokassa (метод GET или POST) → приложение проверит счёт
    location = /app/pay-ok   { return 302 /app/?pay=ok; }
    location = /app/pay-fail { return 302 /app/?pay=fail; }

    # Сервис-воркер и манифест — всегда свежие
    location ~ sw\.js$ { add_header Cache-Control "no-cache"; }
    location ~ \.webmanifest$ { types { application/manifest+json webmanifest; } add_header Cache-Control "no-cache"; }

    # APK: /download/android всегда ведёт на текущую версию (новая версия — новое имя файла и правка здесь)
    location = /download/android { add_header Cache-Control "no-cache"; return 302 /download/zvezditsa-1.2.apk; }
    location ~ ^/download/.+\.apk$ {
        types { application/vnd.android.package-archive apk; }
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, max-age=86400";
    }

    location / { try_files $uri $uri.html $uri/ =404; }
}
