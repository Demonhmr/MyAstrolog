plugins {
    id 'com.android.application'
}

// Подпись релиза: keystore.properties рядом с этим проектом (в git не кладём)
def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'ru.zvezditsa.app'
    compileSdk 36

    defaultConfig {
        // ВНИМАНИЕ: applicationId после первой публикации в сторе менять нельзя
        applicationId 'ru.zvezditsa.app'
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName '1.2'
        // Откуда грузится приложение (с 1.1 — домен zvezditsa.ru; 1.0 грузила sslip, он теперь редиректит сюда)
        buildConfigField 'String', 'START_URL', '"https://zvezditsa.ru/app/"'
        buildConfigField 'String', 'SITE_HOST', '"zvezditsa.ru"'
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
